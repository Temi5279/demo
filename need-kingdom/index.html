<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Need Kingdom | Artisanal Tea Shop & Delivery</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0b0f19;
            --card-bg: #131b2e;
            --accent: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(19, 27, 46, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            color: #0b0f19;
            font-size: 1.2rem;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .logo-text {
            font-family: 'Cinzel', serif;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        .cart-badge {
            background: var(--card-bg);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cart-badge:hover {
            background: var(--accent);
            color: var(--bg-deep);
        }

        .hero {
            text-align: center;
            padding: 60px 20px 40px;
            background: radial-gradient(circle at center, rgba(245, 158, 11, 0.08) 0%, transparent 70%);
        }

        .hero h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #fef3c7;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1rem;
            max-width: 500px;
            margin: 0 auto;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px 60px;
            width: 100%;
            flex: 1;
        }

        .filters {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg-deep);
            font-weight: 600;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .menu-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .menu-card:hover {
            transform: translateY(-3px);
            border-color: rgba(245, 158, 11, 0.4);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .item-name {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .item-price {
            color: var(--accent);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .item-desc {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .add-btn {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--accent);
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .add-btn:hover {
            background: var(--accent);
            color: var(--bg-deep);
        }

        .order-section {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            margin-top: 20px;
        }

        .order-section h3 {
            font-family: 'Cinzel', serif;
            margin-bottom: 15px;
            font-size: 1.25rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            background: var(--bg-deep);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
        }

        .checkout-btn {
            width: 100%;
            background: #22c55e;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        .checkout-btn:hover {
            opacity: 0.9;
        }

        footer {
            text-align: center;
            padding: 25px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.85rem;
            background: var(--card-bg);
        }

        @media (max-width: 600px) {
            .hero h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon">N</div>
            <div class="logo-text">Need Kingdom</div>
        </div>
        <div class="cart-badge" id="cart-indicator">Bag: 0 items</div>
    </header>

<section class="hero">
        <h1>Royal Artisanal Teas</h1>
        <p>Hand-blended botanical infusions & premium leaf selections delivered straight to your door.</p>
    </section>

    <div class="container">
        <div class="filters">
            <button class="filter-btn active" onclick="filterMenu('all')">All Brews</button>
            <button class="filter-btn" onclick="filterMenu('herbal')">Herbal & Floral</button>
            <button class="filter-btn" onclick="filterMenu('green')">Green Tea</button>
            <button class="filter-btn" onclick="filterMenu('black')">Black & Spiced</button>
        </div>

        <div class="menu-grid" id="menu-items">
            <!-- Populated by JavaScript -->
        </div>

        <div class="order-section">
            <h3>Complete Your Order</h3>
            <div class="form-group">
                <label for="delivery-option">Delivery / Pickup Option</label>
                <select id="delivery-option" class="form-control">
                    <option value="Standard Home Delivery ($5)">Standard Home Delivery (+$5.00)</option>
                    <option value="Express Priority Delivery ($10)">Express Priority Delivery (+$10.00)</option>
                    <option value="Free Shop Pickup ($0)">Free Shop Pickup ($0.00)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="customer-address">Delivery Address / Notes</label>
                <input type="text" id="customer-address" class="form-control" placeholder="Enter your street address or landmark...">
            </div>
            <button class="checkout-btn" onclick="sendOrderWhatsApp()">Order via WhatsApp 🚀</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Need Kingdom Tea Shop. Demo prototype created by Temiloluwa.</p>
    </footer>

    <script>
        const menuData = [
            { id: 1, name: "Imperial Jasmine Green", category: "green", price: 12.50, desc: "Delicate green tea leaves scented with fresh night-blooming jasmine blossoms." },
            { id: 2, name: "Royal Chai Spiced Black", category: "black", price: 10.00, desc: "Bold black tea infused with cardamom, cinnamon, ginger, and cloves." },
            { id: 3, name: "Midnight Lavender Chamomile", category: "herbal", price: 11.00, desc: "Calming caffeine-free blend of whole chamomile flowers and French lavender." },
            { id: 4, name: "Golden Moroccan Mint", category: "green", price: 9.50, desc: "Refreshing gunpowder green tea blended with sweet hand-picked Moroccan spearmint." },
            { id: 5, name: "Velvet Earl Grey Supreme", category: "black", price: 13.00, desc: "Ceylon black tea infused with pure Italian bergamot oil and blue cornflowers." },
            { id: 6, name: "Hibiscus Ginger Zest", category: "herbal", price: 10.50, desc: "Tart ruby red hibiscus petals with a sharp kick of organic ginger root." }
        ];

        let cart = {};

        function renderMenu(category = 'all') {
            const grid = document.getElementById('menu-items');
            grid.innerHTML = '';
            
            const filtered = category === 'all' ? menuData : menuData.filter(item => item.category === category);
            
            filtered.forEach(item => {
                grid.innerHTML += `
                    <div class="menu-card">
                        <div>
                            <div class="item-header">
                                <span class="item-name">${item.name}</span>
                                <span class="item-price">$${item.price.toFixed(2)}</span>
                            </div>
                            <p class="item-desc">${item.desc}</p>
                        </div>
                        <button class="add-btn" onclick="addToCart(${item.id})">Add to Bag</button>
                    </div>
                `;
            });
        }

        function filterMenu(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderMenu(category);
        }

        function addToCart(id) {
            cart[id] = (cart[id] || 0) + 1;
            updateCartIndicator();
        }

        function updateCartIndicator() {
            const totalItems = Object.values(cart).reduce((a, b) => a + b, 0);
            document.getElementById('cart-indicator').innerText = `Bag: ${totalItems} items`;
        }

        function sendOrderWhatsApp() {
            const totalItems = Object.values(cart).reduce((a, b) => a + b, 0);
            if(totalItems === 0) {
                alert("Please add at least one tea to your bag before ordering!");
                return;
            }

            const delivery = document.getElementById('delivery-option').value;
            const address = document.getElementById('customer-address').value;

            let message = "Hello Need Kingdom! I'd like to place an order:%0A%0A";
            for(let id in cart) {
                const item = menuData.find(i => i.id == id);
                message += `- ${item.name} x${cart[id]} ($${(item.price * cart[id]).toFixed(2)})%0A`;
            }
            message += `%0A*Fulfillment:* ${delivery}`;
            if(address) message += `%0A*Address:* ${address}`;

            window.open(`https://wa.me/?text=${message}`, '_blank');
        }

        renderMenu();
    </script>
</body>
</html>
